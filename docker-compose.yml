name: diasekovaltchuk-adv-dev

x-secret-environment: &secret-environment
  FLASK_SECRET_KEY_FILE: /run/secrets/flask_secret_key
  MAIL_PASSWORD_FILE: /run/secrets/mail_password
  TURNSTILE_SECRET_KEY_FILE: /run/secrets/turnstile_secret_key
  RECAPTCHA_SECRET_KEY_FILE: /run/secrets/recaptcha_secret_key
  HCAPTCHA_SECRET_KEY_FILE: /run/secrets/hcaptcha_secret_key
  FLASK_SECRET_KEY: ""
  MAIL_PASSWORD: ""
  TURNSTILE_SECRET_KEY: ""
  RECAPTCHA_SECRET_KEY: ""
  HCAPTCHA_SECRET_KEY: ""

x-app-secrets: &app-secrets
  - flask_secret_key
  - mail_password
  - turnstile_secret_key
  - recaptcha_secret_key
  - hcaptcha_secret_key

x-app-runtime: &app-runtime
  labels:
    infra.project: diasekovaltchuk-adv
    infra.environment: development
    infra.version: ${IMAGE_TAG:-local}
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m
  ulimits:
    core:
      soft: 0
      hard: 0
  healthcheck:
    test: ["CMD", "python3", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 12
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    image: diasekovaltchuk-adv/app:${IMAGE_TAG:-local}-dev
    <<: *app-runtime
    restart: unless-stopped
    build: .
    working_dir: /app
    ports:
      - "3003:3003"
    environment:
      <<: *secret-environment
      PORT: 3003
      SWAGGER_ENABLED: "true"
    env_file:
      - .env
    secrets: *app-secrets
    networks:
      - proxy-network

secrets:
  flask_secret_key:
    environment: FLASK_SECRET_KEY
  mail_password:
    environment: MAIL_PASSWORD
  turnstile_secret_key:
    environment: TURNSTILE_SECRET_KEY
  recaptcha_secret_key:
    environment: RECAPTCHA_SECRET_KEY
  hcaptcha_secret_key:
    environment: HCAPTCHA_SECRET_KEY

networks:
  proxy-network:
    external: true
