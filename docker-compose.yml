x-secret-environment: &secret-environment
  APP_SECRETS_FILE: /run/secrets/app_secrets
  FLASK_SECRET_KEY: ""
  MAIL_PASSWORD: ""
  TURNSTILE_SECRET_KEY: ""
  RECAPTCHA_SECRET_KEY: ""
  HCAPTCHA_SECRET_KEY: ""

x-app-secrets: &app-secrets
  - app_secrets

services:
  diasekovaltchuk:
    profiles: ["prod"]
    restart: unless-stopped
    build: .
    working_dir: /app
    ports:
      - "3002:3002"
    environment:
      <<: *secret-environment
      PORT: 3002
    env_file:
      - .env
    secrets: *app-secrets
    networks:
      - proxy-network

  diasekovaltchuk-dev:
    profiles: ["dev"]
    restart: unless-stopped
    build: .
    working_dir: /app
    ports:
      - "3003:3003"
    environment:
      <<: *secret-environment
      PORT: 3003
    env_file:
      - .env
    secrets: *app-secrets
    networks:
      - proxy-network

secrets:
  app_secrets:
    file: ${APP_SECRETS_SOURCE:?Defina APP_SECRETS_SOURCE no .env}

networks:
  proxy-network:
    external: true
