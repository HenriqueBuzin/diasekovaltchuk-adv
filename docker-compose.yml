x-secret-environment: &secret-environment
  FLASK_SECRET_KEY_FILE: /run/secrets/flask_secret_key
  MAIL_PASSWORD_FILE: /run/secrets/mail_password
  TURNSTILE_SECRET_KEY_FILE: /run/secrets/turnstile_secret_key
  RECAPTCHA_SECRET_KEY_FILE: /run/secrets/recaptcha_secret_key
  HCAPTCHA_SECRET_KEY_FILE: /run/secrets/hcaptcha_secret_key
  FLASK_SECRET_KEY: ""
  MAIL_PASSWORD: ""
  TURNSTILE_SECRET_KEY: ""
  RECAPTCHA_SECRET_KEY: ""
  HCAPTCHA_SECRET_KEY: ""

x-app-secrets: &app-secrets
  - flask_secret_key
  - mail_password
  - turnstile_secret_key
  - recaptcha_secret_key
  - hcaptcha_secret_key

services:
  diasekovaltchuk:
    profiles: ["prod"]
    restart: unless-stopped
    build: .
    working_dir: /app
    ports:
      - "3002:3002"
    environment:
      <<: *secret-environment
      PORT: 3002
    env_file:
      - .env
    secrets: *app-secrets
    networks:
      - proxy-network

  diasekovaltchuk-dev:
    profiles: ["dev"]
    restart: unless-stopped
    build: .
    working_dir: /app
    ports:
      - "3003:3003"
    environment:
      <<: *secret-environment
      PORT: 3003
    env_file:
      - .env
    secrets: *app-secrets
    networks:
      - proxy-network

secrets:
  flask_secret_key:
    environment: FLASK_SECRET_KEY
  mail_password:
    environment: MAIL_PASSWORD
  turnstile_secret_key:
    environment: TURNSTILE_SECRET_KEY
  recaptcha_secret_key:
    environment: RECAPTCHA_SECRET_KEY
  hcaptcha_secret_key:
    environment: HCAPTCHA_SECRET_KEY

networks:
  proxy-network:
    external: true
