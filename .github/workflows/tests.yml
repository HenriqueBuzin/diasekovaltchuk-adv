name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Install
        run: pipx install poetry==2.4.1

      - name: Install Python dependencies
        run: poetry install --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: poetry run python scripts/run_tests.py

      - name: Compose
        env:
          FLASK_SECRET_KEY: ci-flask-key
          MAIL_PASSWORD: ci-mail-password
          TURNSTILE_SECRET_KEY: ci-turnstile
          RECAPTCHA_SECRET_KEY: ci-recaptcha
          HCAPTCHA_SECRET_KEY: ci-hcaptcha
        run: |
          install -m 600 /dev/null .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose-prod.yml config --quiet

      - name: Container
        run: docker build --tag diasekovaltchuk-adv:ci .

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: diasekovaltchuk-adv:ci
          artifact-name: diasekovaltchuk-adv.spdx.json

      - name: Scan container
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: diasekovaltchuk-adv:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true

      - name: Deploy
        run: echo "Deploy autorizado apenas pelo Jenkins em main/dev."
