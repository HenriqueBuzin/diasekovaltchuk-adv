name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: "8.5.9"
          extensions: dom, intl, mbstring, zip
          coverage: xdebug
          tools: composer:2.10.1

      - name: Install backend dependencies
        run: composer --working-dir=backend install --no-interaction --prefer-dist --no-scripts

      - name: Discover backend packages
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: php backend/artisan package:discover --ansi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          cache: npm

      - name: Install frontend dependencies
        run: |
          npm install --global npm@12.0.2
          npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify backend
        env:
          XDEBUG_MODE: coverage
        run: |
          composer --working-dir=backend audit
          composer --working-dir=backend format:check
          composer --working-dir=backend analyse
          php -d memory_limit=1G backend/vendor/bin/phpunit --coverage-clover=backend/coverage.xml
          php backend/scripts/check-coverage.php backend/coverage.xml

      - name: Verify frontend
        run: |
          npm audit --audit-level=high
          npm run format:frontend:check
          npm run lint:frontend
          npm run typecheck:frontend
          npm run test:frontend

      - name: Verify E2E
        run: npm run test:e2e

      - name: Compose
        env:
          FLASK_SECRET_KEY: ci-flask-key
          MAIL_PASSWORD: ci-mail-password
          TURNSTILE_SECRET_KEY: ci-turnstile
          RECAPTCHA_SECRET_KEY: ci-recaptcha
          HCAPTCHA_SECRET_KEY: ci-hcaptcha
        run: |
          install -m 600 /dev/null .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose-prod.yml config --quiet

      - name: Container
        run: docker build --tag diasekovaltchuk-adv:ci .

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: diasekovaltchuk-adv:ci
          artifact-name: diasekovaltchuk-adv.spdx.json

      - name: Scan container
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: diasekovaltchuk-adv:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true

      - name: Deploy
        run: echo "Deploy autorizado apenas pelo Jenkins em main/dev."
